<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0b15">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Nocturna</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-overlay visible" id="auth-overlay">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="owl-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <rect x="12" y="18" width="40" height="26" rx="6" fill="rgba(255,255,255,0.08)"/>
          <rect x="20" y="14" width="24" height="8" rx="4" fill="#facc15" opacity="0.9"/>
          <path d="M18 31c2-9 9-15 14-15s12 6 14 15" fill="none" stroke="#f4f2fb" stroke-width="3" stroke-linecap="round"/>
          <circle cx="24" cy="30" r="4" fill="#f4f2fb"/>
          <circle cx="40" cy="30" r="4" fill="#f4f2fb"/>
          <path d="M27 38c2 2 8 2 10 0" fill="none" stroke="#f4f2fb" stroke-width="3" stroke-linecap="round"/>
          <path d="M18 22l-10 8M46 22l10 8" stroke="#f4f2fb" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
          <path d="M22 46h20v8H22z" fill="#a78bfa" opacity="0.8"/>
        </svg>
      </div>
      <div>
        <h2>Nocturna</h2>
        <p>Private calendar</p>
      </div>
    </div>

    <div class="auth-tabs">
      <button type="button" class="tab-button active" data-mode="login">Log in</button>
      <button type="button" class="tab-button" data-mode="register">Create</button>
    </div>

    <form class="auth-form" id="auth-form">
      <input type="hidden" id="auth-mode" value="login">
      <div class="auth-field">
        <label for="auth-name">Username</label>
        <input id="auth-name" type="text" autocomplete="username" placeholder="Your name" maxlength="30">
      </div>
      <div class="auth-field">
        <label for="auth-password">Password</label>
        <div class="password-wrap">
          <input id="auth-password" type="password" autocomplete="current-password" placeholder="Password (min 6 chars)">
          <button type="button" class="password-toggle" data-target="auth-password" aria-label="Show password">Show</button>
        </div>
      </div>
      <div class="auth-field" id="auth-confirm-wrap" style="display:none;">
        <label for="auth-confirm">Confirm password</label>
        <div class="password-wrap">
          <input id="auth-confirm" type="password" autocomplete="new-password" placeholder="Repeat password">
          <button type="button" class="password-toggle" data-target="auth-confirm" aria-label="Show confirm password">Show</button>
        </div>
      </div>
      <div class="auth-error" id="auth-error"></div>
      <button type="submit" class="auth-submit" id="auth-submit">Log in</button>
    </form>
  </div>
</div>

<header class="top">
  <div class="brand-block">
    <div class="owl-mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <rect x="12" y="18" width="40" height="26" rx="6" fill="rgba(255,255,255,0.08)"/>
        <rect x="20" y="14" width="24" height="8" rx="4" fill="#facc15" opacity="0.9"/>
        <path d="M18 31c2-9 9-15 14-15s12 6 14 15" fill="none" stroke="#f4f2fb" stroke-width="3" stroke-linecap="round"/>
        <circle cx="24" cy="30" r="4" fill="#f4f2fb"/>
        <circle cx="40" cy="30" r="4" fill="#f4f2fb"/>
        <path d="M27 38c2 2 8 2 10 0" fill="none" stroke="#f4f2fb" stroke-width="3" stroke-linecap="round"/>
        <path d="M18 22l-10 8M46 22l10 8" stroke="#f4f2fb" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
        <path d="M22 46h20v8H22z" fill="#a78bfa" opacity="0.8"/>
      </svg>
    </div>
    <div class="brand-copy">
      <h1>Nocturna</h1>
      <p>What's the story?</p>
    </div>
  </div>

  <div class="top-search-wrap">
    <input id="search-input" class="top-search" type="search" placeholder="Search events…" aria-label="Search calendar events">
  </div>

  <div class="top-actions">
    <button id="auth-button" class="primary-button">Log in</button>
    <button id="logout-button" class="ghost-button">Log out</button>
  </div>
</header>

<div id="calendar-list"></div>
<div id="sentinel"></div>
<div class="loading-row">Loading…</div>
<button id="today-button" class="today-button" aria-label="Jump to today">Today</button>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h3 id="sheet-date">Day</h3>
    <button class="sheet-close" id="sheet-close" aria-label="Close">&times;</button>
  </div>

  <div class="done-toggle">
    <span id="done-label">Mark day complete</span>
    <div class="switch" id="done-switch"><div class="knob"></div></div>
  </div>

  <div class="event-list" id="event-list"></div>
  <p class="empty-hint" id="empty-hint" style="display:none;">No events yet — add one below.</p>

  <form class="event-form" id="event-form">
    <div class="field">
      <label for="f-title">Event</label>
      <input type="text" id="f-title" placeholder="What's happening?" maxlength="60">
    </div>
    <div class="row2">
      <div class="field">
        <label for="f-time">Time</label>
        <input type="time" id="f-time">
      </div>
      <div class="field">
        <label for="f-location">Location</label>
        <input type="text" id="f-location" placeholder="Optional" maxlength="60">
      </div>
    </div>
    <div class="field toggle-row">
      <label for="f-all-day">All day</label>
      <div class="toggle-wrap">
        <input type="checkbox" id="f-all-day">
      </div>
    </div>
    <div class="field">
      <label for="f-repeat">Repeat</label>
      <select id="f-repeat">
        <option value="none">Does not repeat</option>
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
        <option value="monthly">Monthly</option>
        <option value="yearly">Yearly / Birthday</option>
      </select>
    </div>
    <div class="field">
      <label for="f-reminder">Reminder</label>
      <select id="f-reminder">
        <option value="none">No reminder</option>
        <option value="15m">15 minutes before</option>
        <option value="1h">1 hour before</option>
        <option value="1d">1 day before</option>
        <option value="1w">1 week before</option>
      </select>
    </div>
    <div class="field">
      <label>Event color</label>
      <div class="color-row" id="color-row"></div>
    </div>
    <div class="field">
      <label for="f-day-color">Day color</label>
      <input type="color" id="f-day-color" value="#8b5cf6" aria-label="Day color">
    </div>
    <p class="err" id="form-err" style="display:none;">Give the event a name first.</p>
    <div class="form-actions">
      <button type="button" class="btn btn-secondary" id="cancel-edit" style="display:none;">Cancel</button>
      <button type="submit" class="btn btn-primary" id="save-btn">Add event</button>
    </div>
  </form>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
