name: Nocturna notifier

# The schedule now runs on the Mac (see notifier/mac/). This workflow is
# manual-only. To move scheduling back to GitHub, add:
#   schedule:
#     - cron: '*/15 * * * *'
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = normal run, test = send a test + briefing now, digest = force morning briefing, evening = force tomorrow preview'
        type: choice
        options: [auto, test, digest, evening]
        default: test

concurrency:
  group: nocturna-notifier
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: notifier
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: notifier/package-lock.json

      - run: npm ci --omit=dev --no-audit --no-fund

      - name: Send notifications
        run: node notify.js
        env:
          MODE: ${{ inputs.mode || 'auto' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOCTURNA_USERNAME: ${{ vars.NOCTURNA_USERNAME }}
          NOCTURNA_APP_URL: ${{ vars.NOCTURNA_APP_URL }}
          DIGEST_TIME: ${{ vars.DIGEST_TIME || '06:30' }}
          EVENING_TIME: ${{ vars.EVENING_TIME || '20:00' }}
